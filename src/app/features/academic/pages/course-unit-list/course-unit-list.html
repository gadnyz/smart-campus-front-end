<p-toast />

<app-content-subtopbar kicker="Academic" title="Unités d’enseignement" [actions]="actions()" />

<div class="card">
    <p-table #dt [value]="units()" [loading]="loading()" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[10, 20, 50]" [globalFilterFields]="['code']" [rowHover]="true" dataKey="id"
        responsiveLayout="scroll" currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} UE"
        [showCurrentPageReport]="true" [tableStyle]="{ 'min-width': '40rem' }">
        <ng-template pTemplate="caption">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div class="font-semibold text-xl">Liste des UE</div>
                <div class="flex flex-col gap-3 md:flex-row md:items-center">
                    @if (canReadAll()) {
                    <p-select [options]="facultyOptions()" optionLabel="label" optionValue="value"
                        [ngModel]="selectedFacultyId()" (ngModelChange)="onFacultyFilterChange($event)"
                        placeholder="Faculté" appendTo="body" class="w-full md:w-14rem" />
                    }
                    <p-select [options]="programOptions()" optionLabel="label" optionValue="value"
                        [ngModel]="selectedProgramId()" (ngModelChange)="onProgramFilterChange($event)"
                        placeholder="Programme" appendTo="body" class="w-full md:w-14rem"
                        [disabled]="!selectedFacultyId()" />
                    <p-select [options]="programLevelOptions()" optionLabel="label" optionValue="value"
                        [ngModel]="selectedProgramLevelId()" (ngModelChange)="onProgramLevelFilterChange($event)"
                        placeholder="Niveau" appendTo="body" class="w-full md:w-12rem"
                        [disabled]="!selectedProgramId()" />
                    <p-iconfield>
                        <p-inputicon styleClass="pi pi-search" />
                        <input pInputText type="text" placeholder="Rechercher..." (input)="onGlobalFilter(dt, $event)" />
                    </p-iconfield>
                </div>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="code">Code <p-sortIcon field="code" /></th>
                <th>Bloc</th>
                <th style="width: 10rem">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-unit>
            <tr>
                <td>{{ unit.code }}</td>
                <td>{{ blocLabel(unit.knowledge_skills_bloc) }}</td>
                <td>
                    <div class="flex gap-2">
                        <button pButton type="button" icon="pi pi-arrow-right" rounded outlined severity="info"
                            (click)="openDetail(unit)"></button>
                        @if (canUpdate()) {
                        <button pButton type="button" icon="pi pi-pencil" rounded outlined severity="info"
                            (click)="openEditDialog(unit)"></button>
                        }
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3">{{ selectedProgramLevelId() ? 'Aucune UE.' : 'Choisissez un niveau de programme.' }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [header]="dialogTitle()" [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)"
    [modal]="true" [style]="{ width: '32rem' }">
    <form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="submit()">
        <div>
            <label class="block text-sm text-color-secondary mb-1">Faculté</label>
            <p-select formControlName="faculty_id" [options]="facultyOptions()" optionLabel="label" optionValue="value"
                appendTo="body" class="w-full" />
        </div>
        <div>
            <label class="block text-sm text-color-secondary mb-1">Programme</label>
            <p-select formControlName="program_id" [options]="programOptions()" optionLabel="label" optionValue="value"
                appendTo="body" class="w-full" />
        </div>
        <div>
            <label class="block text-sm text-color-secondary mb-1">Niveau</label>
            <p-select formControlName="program_level_id" [options]="dialogProgramLevelOptions()" optionLabel="label"
                optionValue="value" appendTo="body" class="w-full" />
        </div>
        <div>
            <label class="block text-sm text-color-secondary mb-1">Code</label>
            <input pInputText formControlName="code" placeholder="UE-INFO-01" class="w-full" />
        </div>
        <div>
            <label class="block text-sm text-color-secondary mb-1">Bloc</label>
            <p-select formControlName="knowledge_skills_bloc" [options]="blocOptions" optionLabel="label"
                optionValue="value" appendTo="body" class="w-full" />
        </div>
        <div class="flex justify-end gap-2">
            <button pButton type="button" label="Annuler" severity="secondary" outlined
                (click)="closeDialog()"></button>
            <button pButton type="submit" label="Enregistrer" icon="pi pi-save" [loading]="saving()"></button>
        </div>
    </form>
</p-dialog>
