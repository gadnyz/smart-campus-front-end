<p-toast />

<app-content-subtopbar kicker="Academic" title="Mes cours" />

<div class="card">
    <p-table
        [value]="rows()"
        [loading]="loading()"
        [rowHover]="true"
        dataKey="course_id"
        responsiveLayout="scroll"
        [tableStyle]="{ 'min-width': '40rem' }"
    >
        <ng-template pTemplate="caption">
            <div class="font-semibold text-xl">Cours qui me sont assignés</div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th>Code</th>
                <th>Nom</th>
                <th>Rôle</th>
                <th style="width: 6rem">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
            <tr>
                <td>{{ row.code }}</td>
                <td>{{ row.name }}</td>
                <td><p-tag [value]="typeLabel(row.role)" /></td>
                <td>
                    <button
                        pButton
                        type="button"
                        icon="pi pi-arrow-right"
                        rounded
                        outlined
                        severity="info"
                        [attr.aria-label]="'Détail ' + row.code"
                        (click)="openDetail(row)"
                    ></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4">Aucun cours ne vous est affecté pour le moment.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
