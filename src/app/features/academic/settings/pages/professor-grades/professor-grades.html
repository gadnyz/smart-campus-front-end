<p-toast />
<p-confirmdialog [style]="{ width: '450px' }" />

<app-content-subtopbar kicker="Paramètres Academic" title="Grades professeurs" [actions]="actions()" />

<div class="card">
    <p-table
        #dt
        [value]="grades()"
        [loading]="loading()"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 20, 50]"
        [globalFilterFields]="['code', 'name']"
        [rowHover]="true"
        dataKey="id"
        responsiveLayout="scroll"
        currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} grades"
        [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '40rem' }"
    >
        <ng-template pTemplate="caption">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div class="font-semibold text-xl">Liste des grades</div>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" placeholder="Rechercher..." (input)="onGlobalFilter(dt, $event)" />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="code">Code <p-sortIcon field="code" /></th>
                <th pSortableColumn="name">Nom <p-sortIcon field="name" /></th>
                <th style="width: 8rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-grade>
            <tr>
                <td>{{ grade.code }}</td>
                <td>{{ grade.name }}</td>
                <td>
                    <div class="flex gap-2">
                        @if (canUpdate()) {
                        <button
                            pButton
                            type="button"
                            icon="pi pi-pencil"
                            rounded
                            outlined
                            severity="info"
                            [attr.aria-label]="'Modifier ' + grade.code"
                            (click)="openEditDialog(grade)"
                        ></button>
                        }
                        @if (canDelete()) {
                        <button
                            pButton
                            type="button"
                            icon="pi pi-trash"
                            rounded
                            outlined
                            severity="danger"
                            [attr.aria-label]="'Supprimer ' + grade.code"
                            (click)="confirmDelete(grade)"
                        ></button>
                        }
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3">Aucun grade.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog
    [header]="dialogTitle()"
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [modal]="true"
    [style]="{ width: '32rem' }"
    [breakpoints]="{ '640px': '95vw' }"
>
    <form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="submit()">
        <div>
            <label for="gradeCode" class="block text-sm text-color-secondary mb-1">Code</label>
            <input pInputText id="gradeCode" formControlName="code" placeholder="ASS" class="w-full" />
            @if (isInvalid('code')) {
            <small class="text-red-500 block mt-1">Le code est obligatoire.</small>
            }
        </div>

        <div>
            <label for="gradeName" class="block text-sm text-color-secondary mb-1">Nom</label>
            <input pInputText id="gradeName" formControlName="name" placeholder="Assistant" class="w-full" />
            @if (isInvalid('name')) {
            <small class="text-red-500 block mt-1">Le nom est obligatoire.</small>
            }
        </div>

        <div class="flex justify-end gap-2">
            <button pButton type="button" label="Annuler" severity="secondary" outlined (click)="closeDialog()"></button>
            <button pButton type="submit" label="Enregistrer" icon="pi pi-save" [loading]="saving()" [disabled]="saving()"></button>
        </div>
    </form>
</p-dialog>
