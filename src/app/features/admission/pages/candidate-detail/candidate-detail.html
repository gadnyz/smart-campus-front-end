<p-toast />
<p-confirmdialog [style]="{ width: '28rem' }" />

<div class="portal-shell">
    <app-content-subtopbar kicker="Admission" [title]="pageTitle()" [actions]="actions()" [navigation]="navigation()" [maxVisible]="2" />

    @if (!candidate() && loading()) {
    <p-skeleton height="9rem" />
    <div class="portal-layout">
        <p-skeleton height="24rem" />
        <p-skeleton height="16rem" />
    </div>

    } @else if (candidate(); as candidate) {
    @if (refreshing()) {
    <p-progressbar mode="indeterminate" [style]="{ height: '3px' }" ariaLabel="Actualisation du candidat" />
    }

    <div class="candidate-content" [class.candidate-content--refreshing]="refreshing()" [attr.aria-busy]="busy()">
        <app-candidate-dossier-hero [candidate]="candidate" [labels]="academicLabels()" [photoUrl]="photoUrl()"
            (photoError)="onPhotoImageError()" />

        <div class="portal-layout">
            <main class="portal-main">
                @if (editing()) {
                <app-candidate-dossier-form [form]="form" [choices]="choices" [labels]="academicLabels()" />
                } @else {
                <app-candidate-dossier-sections [sections]="sections()" idPrefix="candidate-" />
                }
            </main>

            <aside class="portal-aside">
                <app-candidate-dossier-documents [items]="documents()" [urls]="documentUrls.urls()" missingLabel="Non fournie"
                    anchor="candidate-documents" (preview)="openDocument($event)" (imageError)="onDocumentImageError($event)" />
            </aside>
        </div>
    </div>

    } @else {
    <div class="portal-empty">
        <span class="portal-empty__icon"><i class="pi pi-folder-open"></i></span>
        <h2>Candidature introuvable</h2>
        <p>Elle a peut-être été supprimée, ou n’est pas dans votre périmètre.</p>
    </div>
    }
</div>

<p-dialog header="Rejeter la candidature" [visible]="rejectDialogVisible()"
    (visibleChange)="onRejectDialogVisibleChange($event)" [modal]="true" [style]="{ width: '32rem' }"
    [breakpoints]="{ '640px': '95vw' }">
    <p class="reject-dialog-intro">
        Indiquez le motif du rejet.
    </p>

    <!-- @if (currentStatus() === 'DRAFT') {
    <p class="reject-dialog-intro reject-dialog-intro--warn">
        Ce dossier est encore en brouillon.
    </p>
    } -->

    <textarea pTextarea [ngModel]="rejectReason()" (ngModelChange)="rejectReason.set($event)" rows="4" maxlength="500"
        class="w-full" placeholder="Motif du rejet" aria-label="Motif du rejet"></textarea>

    <div class="reject-dialog-footer">
        <button pButton type="button" label="Annuler" severity="secondary" [outlined]="true"
            (click)="onRejectDialogVisibleChange(false)"></button>

        <button pButton type="button" label="Rejeter" icon="pi pi-times" severity="danger"
            [disabled]="!rejectReason().trim() || busy()" (click)="submitReject()"></button>
    </div>
</p-dialog>

<app-candidate-document-preview [document]="previewDocument()" [url]="previewUrl()" [(visible)]="previewVisible" />
