<p-toast />

<app-content-subtopbar
    kicker="Admission"
    title="Candidatures"
    [actions]="actions()"
/>

<p-card>
    <div class="list-header">
        <div>
            <h3 class="list-title">Liste des candidats</h3>
            <span class="text-color-secondary">
                {{ totalElements() }} candidature(s)
            </span>
        </div>

        <div class="list-filters">
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input
                    pInputText
                    type="text"
                    placeholder="Rechercher..."
                    (input)="onGlobalFilter(dt, $event)"
                />
            </p-iconfield>

            @if (!facultyLocked()) {
            <p-select
                [options]="faculties()"
                optionLabel="label"
                optionValue="value"
                placeholder="Toutes les facultés"
                [showClear]="true"
                [filter]="true"
                [loading]="loadingFaculties()"
                [ngModel]="facultyFilter()"
                (ngModelChange)="onFacultyChange($event)"
                ariaLabel="Filtrer par faculté"
            />
            }

            <p-select
                [options]="statusOptions"
                optionLabel="label"
                optionValue="value"
                placeholder="Tous les statuts"
                [showClear]="true"
                [ngModel]="statusFilter()"
                (ngModelChange)="onStatusChange($event)"
            />
        </div>
    </div>

    <p-table styleClass="stack-table"
        #dt
        [value]="candidates()"
        [loading]="loading()"
        dataKey="id"
        [rowHover]="true"
        [globalFilterFields]="[
            'first_name',
            'middle_name',
            'last_name',
            'email',
            'phone'
        ]"
        responsiveLayout="scroll"
        [tableStyle]="{ 'min-width': '64rem' }"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Candidat</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Soumise le</th>
                <th>Statut</th>
                <th class="actions-column">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-candidate>
            <tr>
                <td data-label="Candidat">
                    <div class="font-medium">
                        {{ fullName(candidate) }}
                    </div>
                    <div class="text-sm text-color-secondary">
                        {{ genderLabel(candidate) }}
                    </div>
                </td>

                <td data-label="Email">{{ candidate.email }}</td>
                <td data-label="Téléphone">{{ candidate.phone }}</td>
                <td data-label="Soumise le">{{ submittedLabel(candidate) }}</td>

                <td data-label="Statut">
                    <p-tag
                        [value]="statusLabel(candidate.status)"
                        [severity]="statusSeverity(candidate.status)"
                    />
                </td>

                <td class="stack-actions actions-column">
                    <button pButton type="button" icon="pi pi-arrow-right" rounded outlined
                        [attr.aria-label]="'Ouvrir la candidature de ' + fullName(candidate)" (click)="openCandidate(candidate)"></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6">
                    Aucune candidature trouvée.
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-paginator
        [first]="page() * size()"
        [rows]="size()"
        [totalRecords]="totalElements()"
        [rowsPerPageOptions]="[10, 25, 50]"
        [alwaysShow]="false"
        (onPageChange)="onPageChange($event)"
    />
</p-card>
