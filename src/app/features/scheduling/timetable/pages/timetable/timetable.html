<app-content-subtopbar kicker="Planification" title="Horaires" [actions]="actions()" />

<div class="card flex flex-col gap-4">
    @if (loadError()) {
        <div class="flex flex-wrap items-center gap-3" role="alert">
            <span>{{ loadError() }}</span>
            <p-button label="Réessayer" severity="secondary" [outlined]="true" (onClick)="loadPrograms()" />
        </div>
    }

    <app-timetable-calendar
        [events]="events()"
        [emptyText]="emptyText()"
        [hasFilters]="true"
        [activeFilters]="activeFilters()"
        (rangeChange)="onRangeChange($event)"
        (eventSelected)="onEventSelected($event)"
    >
        <app-timetable-export-menu
            timetableActions
            [documents]="exportDocuments()"
            [disabledReason]="exportDocuments().length ? null : 'Choisissez une promotion qui a un horaire validé sur la période affichée.'"
        />
        <div timetableFilters class="timetable-filters">
            <p-select
                [options]="programOptions()"
                optionLabel="label"
                optionValue="value"
                [ngModel]="programId()"
                (ngModelChange)="onProgramChange($event)"
                [showClear]="true"
                [disabled]="loadingPrograms()"
                placeholder="Programme"
                ariaLabel="Filtrer par programme"
                appendTo="body"
                size="small"
                class="timetable-filter"
            />
            <p-select
                [options]="programLevelOptions()"
                optionLabel="label"
                optionValue="value"
                [ngModel]="programLevelId()"
                (ngModelChange)="onProgramLevelChange($event)"
                [showClear]="true"
                [disabled]="programId() === null"
                placeholder="Niveau"
                ariaLabel="Filtrer par niveau de programme"
                appendTo="body"
                size="small"
                class="timetable-filter"
            />
        </div>
    </app-timetable-calendar>
</div>

<app-timetable-session-dialog [session]="selectedSession()" (closed)="selectedSession.set(null)" />
