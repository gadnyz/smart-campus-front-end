<div class="card">
    <div class="font-semibold text-xl mb-4">Liste des utilisateurs</div>

    <p-table [value]="users" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]"
        responsiveLayout="scroll" dataKey="id">
        <ng-template pTemplate="header">
            <tr>
                <!-- <th style="min-width: 5rem">Photo</th> -->
                <th pSortableColumn="fullName" style="min-width: 14rem">
                    Nom complet
                    <p-sortIcon field="fullName"></p-sortIcon>
                </th>
                <th pSortableColumn="email" style="min-width: 16rem">
                    Email
                    <p-sortIcon field="email"></p-sortIcon>
                </th>
                <th pSortableColumn="businessProfile" style="min-width: 12rem">
                    Profil métier
                    <p-sortIcon field="businessProfile"></p-sortIcon>
                </th>

                <th pSortableColumn="status" style="min-width: 10rem">
                    Statut
                    <p-sortIcon field="status"></p-sortIcon>
                </th>
                <th style="min-width: 10rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
            <tr>
                <!-- <td>
                            <img
                                [src]="user.photo"
                                [alt]="user.fullName"
                                class="w-10 h-10 rounded-full object-cover shadow-sm"
                            />
                        </td> -->
                <td>{{ user.fullName }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.businessProfile }}</td>
                <td>
                    <p-tag [value]="user.status" [severity]="statusSeverity(user.status)" />
                </td>
                <td>
                    <div class="flex items-center gap-2">
                        <button pButton type="button" icon="pi pi-eye" text rounded [routerLink]="['/identity/users', user.id]"></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7">Aucun utilisateur trouvé.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
