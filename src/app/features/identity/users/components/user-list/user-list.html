<div class="card">
    <div class="font-semibold text-xl mb-4">Liste des utilisateurs</div>

    <p-table [value]="users()" [loading]="loading()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]"
        responsiveLayout="scroll" dataKey="id">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="username" style="min-width: 14rem">
                    Nom d'utilisateur
                    <p-sortIcon field="username"></p-sortIcon>
                </th>
                <th pSortableColumn="email" style="min-width: 16rem">
                    Email
                    <p-sortIcon field="email"></p-sortIcon>
                </th>
                <th pSortableColumn="profile" style="min-width: 12rem">
                    Profil
                    <p-sortIcon field="profile"></p-sortIcon>
                </th>
                <th pSortableColumn="enabled" style="min-width: 10rem">
                    Statut
                    <p-sortIcon field="enabled"></p-sortIcon>
                </th>
                <th style="min-width: 10rem">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.profile }}</td>
                <td>
                    <p-tag [value]="statusLabel(user)" [severity]="statusSeverity(user)" />
                </td>
                <td>
                    <div class="flex items-center gap-2">
                        <button pButton type="button" icon="pi pi-pencil" text rounded
                            [routerLink]="['/identity/users', user.id]"></button>

                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="5">Aucun utilisateur trouvé.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
