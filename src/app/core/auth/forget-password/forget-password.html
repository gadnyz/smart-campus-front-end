<div class="login-page bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen overflow-hidden">
    <div class="login-shell flex flex-col items-center justify-center">
        <div class="login-card-frame">
            <div class="login-card w-full bg-surface-0 dark:bg-surface-900">
                <div class="text-center mb-6">
                    <div class="login-brand-row text-surface-900 dark:text-surface-0">
                        <img [src]="brand().logos.main" [alt]="brand().appName" class="login-logo shrink-0" />

                        <span class="login-brand"> {{ brand().appName }} </span>
                    </div>

                    <div class="login-heading text-surface-900 dark:text-surface-0">Avez-vous oublié votre mot de passe ?</div>
                </div>

                <form class="login-form" #nativeForm novalidate (ngSubmit)="submit(nativeForm)">
                    <label for="email" class="block text-surface-900 dark:text-surface-0"> Nous vous enverrons un lien de récupération à : </label>

                    <input pInputText id="email" name="email" type="email" required email placeholder="Saisissez votre adresse mail" class="w-full mb-4" [(ngModel)]="email" />

                    @if (successMessage()) {
                    <p-message severity="success" [text]="successMessage()" styleClass="w-full mb-4 block" />
                    } @if (errorMessage()) {
                    <p-message severity="error" [text]="errorMessage()" styleClass="w-full mb-4 block" />
                    }

                    <p-button label="Envoyez le lien" styleClass="w-full" [loading]="loading()" type="submit" />
                </form>

                <div class="login-back">
                    <a routerLink="/auth/login"> Retour à l'accueil </a>
                </div>

                <app-auth-footer />
            </div>
        </div>
    </div>
</div>
