<p-toast />
<div class="login-page bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen overflow-hidden">
    <div class="login-shell flex flex-col items-center justify-center">
        <div class="login-card-frame">
            <div class="login-card w-full bg-surface-0 dark:bg-surface-900">
                <div class="text-center mb-6">
                    <div class="login-brand-row text-surface-900 dark:text-surface-0">
                        <img src="images/icons/logo.png" [alt]="brand.appName" class="login-logo shrink-0" />

                        <span class="login-brand"> {{ brand.appName }} </span>
                    </div>

                    <div class="login-heading text-surface-900 dark:text-surface-0">Connectez-vous pour continuer</div>
                </div>

                <form class="login-form" #nativeForm novalidate (ngSubmit)="submit(nativeForm)">
                    <label for="email1" class="block text-surface-900 dark:text-surface-0"> Email </label>

                    <input pInputText id="email1" name="email" type="email" required email placeholder="Saisissez votre adresse mail" class="w-full mb-4" [(ngModel)]="email" #emailModel="ngModel" />

                    @if (validationErrors()['email']) {
                    <small class="text-red-500 block mb-2"> {{ validationErrors()['email'] }} </small>
                    }

                    <label for="password1" class="block text-surface-900 dark:text-surface-0"> Mot de passe </label>

                    <p-password id="password1" name="password" required [(ngModel)]="password" placeholder="Saisissez votre mot de passe" [toggleMask]="true" styleClass="mb-3" [fluid]="true" [feedback]="false" #passwordModel="ngModel" />

                    @if (validationErrors()['password']) {
                    <small class="text-red-500 block mb-3"> {{ validationErrors()['password'] }} </small>
                    } @if (errorMessage()) {
                    <p-message severity="error" [text]="errorMessage()" styleClass="w-full mb-4 block" />
                    }

                    <p-button label="Se connecter" styleClass="w-full" [loading]="loading()" type="submit" />
                </form>

                <div class="login-back">
                    <a routerLink="/auth/forget-password" class="font-medium no-underline cursor-pointer text-primary"> Mot de passe oublié ? </a>
                </div>

                <app-auth-footer />
            </div>
        </div>
    </div>
</div>
