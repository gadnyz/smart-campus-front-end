<div class="login-page bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen overflow-hidden">
    <div class="login-shell flex flex-col items-center justify-center">
        <div class="login-card-frame">
            <div class="login-card w-full bg-surface-0 dark:bg-surface-900">
                <div class="text-center mb-6">
                    <div class="login-brand-row text-surface-900 dark:text-surface-0">
                        <img src="images/icons/logo.png" [alt]="brand.appName" class="login-logo shrink-0" />

                        <span class="login-brand">
                            {{ brand.appName }}
                        </span>
                    </div>

                    <div class="login-heading text-surface-900 dark:text-surface-0">
                        Choisir un nouveau mot de passe
                    </div>
                </div>

                <form class="login-form" #nativeForm novalidate (ngSubmit)="submit(nativeForm)">
                    <label for="password" class="block text-surface-900 dark:text-surface-0">
                        Nouveau mot de passe :
                    </label>

                    <p-password
                        id="password"
                        name="password"
                        required
                        [(ngModel)]="password"
                        placeholder="Saisissez votre nouveau mot de passe"
                        [toggleMask]="true"
                        styleClass="mb-4"
                        [fluid]="true"
                        [feedback]="false"
                    />

                    <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0">
                        Confirmation du mot de passe :
                    </label>

                    <p-password
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        [(ngModel)]="confirmPassword"
                        placeholder="Confirmez votre nouveau mot de passe"
                        [toggleMask]="true"
                        styleClass="mb-4"
                        [fluid]="true"
                        [feedback]="false"
                    />

                    @if (successMessage()) {
                        <p-message severity="success" [text]="successMessage()" styleClass="w-full mb-4 block" />
                    }

                    @if (errorMessage()) {
                        <p-message severity="error" [text]="errorMessage()" styleClass="w-full mb-4 block" />
                    }

                    <p-button
                        label="Continuer"
                        styleClass="w-full"
                        [loading]="loading()"
                        type="submit"
                    />
                </form>

                <div class="login-back">
                    <a routerLink="/auth/login">
                        Retour à l'accueil
                    </a>
                </div>

                <app-auth-footer/>
            </div>
        </div>
    </div>
</div>
