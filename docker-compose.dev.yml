services:
  smart-campus-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smart-campus-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "node_modules/.bin/ng",
        "serve",
        "--host",
        "0.0.0.0",
        "--port",
        "4200",
        "--poll",
        "2000",
        "--proxy-config",
        "proxy.conf.docker.json"
      ]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true
