services:
  smart-campus-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: smart-campus-dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    stdin_open: true
    tty: true
